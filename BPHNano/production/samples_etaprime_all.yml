# was checked to reproduce 15X output bit for bit on 2023D rereco, 2024G MINIv6 and 2025D prompt
# (247 eta'/electron/muon branches, identical event lists and candidate counts).
#
# Processing choice per era:
#   2022C, 2022D  10Dec2022 ReReco  (-v2; ParkingDoubleMuonLowMass1 is -v3). NOT PromptReco:
#                 C/D prompt has ECAL issues, and 2022C prompt is also missing
#                 oniaPhotonCandidates in ~10% of events (declared but not written).
#   2022E         PromptReco        (no issue there)
